<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/smlt-max-fixed.png?v=1">
  <link rel="apple-touch-icon" type="image/png" href="/smlt-max-fixed.png?v=1">
  <title>SMLT Max</title>  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body class="booting"><a id="smltHome" class="site-link" href="https://smlt.lol/">← SMLT website</a><button id="lang" class="secondary" style="position:fixed;top:14px;right:14px;z-index:5;padding:8px 12px">EN</button><main>
  <section id="welcome" class="screen active card"><div class="brand"><img class="brand-logo" src="/smlt-max-fixed.png?v=1" alt="SMLT Max"><h1>SMLT Max</h1></div><p id="profileRedirect">Set up your profile on max.smlt.lol — you’ll return here afterwards.</p><a id="profileLink" href="https://max.smlt.lol/">Open SMLT Max</a></section>
  <section id="menu" class="screen"><div class="top"><div><h1>Your chats</h1></div><div class="row menu-actions"><button id="myProfile" class="secondary">My profile</button><button id="changeNick" class="secondary">Edit profile</button></div></div><div class="card"><div class="row" style="margin-top:10px"><input id="roomCode" maxlength="128" placeholder="Room code"><button id="addRoom">Join</button></div><button id="newRoom" class="secondary" style="width:100%;margin-top:10px">＋ Create a new room</button></div><div id="rooms" style="margin-top:16px"></div></section>
  <section id="chat" class="screen"><div class="top"><button id="back" class="secondary">← Chats</button><div class="row" style="justify-content:flex-end"><button id="editProfileRoom" class="secondary">Edit profile</button><button id="rename" class="secondary">Rename</button><button id="copy" class="secondary">Copy link</button></div></div><div class="card"><h2 id="chatTitle"></h2><div class="muted" id="chatCode"></div><div id="messages" class="messages"></div><div class="compose"><textarea id="body" maxlength="2000" placeholder="Write a message..."></textarea><button id="send">Send</button></div></div></section>
</main><dialog id="profileDialog" class="profile-dialog" aria-labelledby="profileName"><button id="closeProfile" class="profile-close secondary" type="button" aria-label="Close profile">×</button><img id="profileAvatar" class="profile-avatar" alt=""><p id="profileCaption" class="muted">User profile</p><h2 id="profileName"></h2><div id="registrationNickname" class="registration-nickname" hidden><span id="registrationNicknameLabel" class="muted"></span><strong id="registrationNicknameValue"></strong></div><span id="profileColor" class="profile-color"></span></dialog><div id="toast" class="toast"></div>
<script type="module" src="/app.js?v=6"></script></body></html>
